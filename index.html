<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Minds Blog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Creative Minds</h1>
            <p>Exploring ideas that inspire</p>
        </header>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search articles...">
            <span class="search-icon">🔍</span>
        </div>

        <div class="categories">
            <button class="category-btn active" data-category="all">All</button>
            <button class="category-btn" data-category="technology">Technology</button>
            <button class="category-btn" data-category="design">Design</button>
            <button class="category-btn" data-category="lifestyle">Lifestyle</button>
            <button class="category-btn" data-category="travel">Travel</button>
        </div>

        <div class="blog-grid" id="blogGrid"></div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeBtn">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
